# EXEMPLO — docker-compose.yml: app + Redis + Postgres
# Rode com: docker compose -f exemplo.docker-compose.yml up

version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: exemplo.Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://usuario:senha@postgres:5432/meubanco
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: meubanco
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U usuario']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
